name: Family + appearance regression
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Clean constrained runtime install and compatibility
        run: |
          python -m venv /tmp/kg-runtime
          /tmp/kg-runtime/bin/python -m pip install --upgrade pip==26.2.2
          /tmp/kg-runtime/bin/python -m pip install -r requirements.txt
          /tmp/kg-runtime/bin/python -m pip check
          mkdir -p visual-evidence
          /tmp/kg-runtime/bin/python -m pip freeze --all > visual-evidence/runtime-freeze.txt
      - name: Audit every resolved runtime package with a separate auditor
        run: |
          python -m venv /tmp/kg-auditor
          /tmp/kg-auditor/bin/python -m pip install pip-audit==2.10.1
          /tmp/kg-auditor/bin/python -m pip_audit --path /tmp/kg-runtime/lib/python3.12/site-packages --format json --output visual-evidence/runtime-audit.json
          /tmp/kg-runtime/bin/python scripts/check_runtime_audit.py visual-evidence/runtime-freeze.txt visual-evidence/runtime-audit.json
      - name: Upload dependency evidence even on audit or network failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-security
          path: visual-evidence/
          retention-days: 14
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kindergarten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d kindergarten_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgresql://test:test@127.0.0.1:5432/kindergarten_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -c constraints-python312.txt pytest playwright pypdf==6.1.3 pypdfium2==5.14.0 httpx==0.28.1
          pip check
          mkdir -p visual-evidence
          pip freeze > visual-evidence/installed-versions.txt
      - name: Validate Arabic and French translation catalog
        run: python scripts/check_translations.py
      - name: Python syntax
        run: python -m compileall -q app.py db.py ui.py style.py sections tests monthly_finance.py receipt_history.py receipt_pdf.py
      - name: Explicit atomic schema upgrade outside user sessions
        run: python -m schema_migrations --dsn-env TEST_POSTGRES_DSN
      - name: Full PostgreSQL integration and UI tests across conflicting timezones
        env:
          TZ: Pacific/Honolulu
          PGOPTIONS: -c timezone=Europe/Berlin
        run: |
          python -m pytest -q tests/
          cat visual-evidence/overview-500.json
      - name: Install Chromium for browser tests
        timeout-minutes: 10
        run: |
          # Avoid prolonged stalls on the hosted runner's Azure APT mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-downloads
          python -m playwright install --with-deps chromium
      - name: Actual Streamlit and Starlette image, ZIP and PDF responses
        run: python -m tests.browser_dependency_responses
      - name: French interface, LTR mobile and login language selection
        run: python -m tests.browser_french
      - name: Manual dates, calendar validation, drafts and bilingual mobile layout
        run: python -m tests.browser_date_entry
      - name: Student portraits across lists, receipts, attendance and photo changes
        run: python -m tests.browser_student_portraits
      - name: Period reports, reconciled details, exports, filters and mobile
        run: python -m tests.browser_period_reports
      - name: Synthetic Pages preview journeys and mobile screenshots
        run: python tests/browser_operator_preview.py
      - name: Record editing, cancellation, audit and mobile totals in Chromium
        run: python tests/browser_record_preview.py
      - name: Unified receipt list, family search and in-document actions
        run: python tests/browser_receipt_search_preview.py
      - name: Synthetic manager and worker accounts preview
        run: python tests/browser_admin_preview.py
      - name: Synthetic student file and optional private portrait preview
        run: python tests/browser_student_profile_preview.py
      - name: Start original Pages with real services on a private synthetic schema
        shell: bash
        run: |
          python -m tests.qa_live_pages setup --directory /tmp/kg-original-pages-qa
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          (python -m tests.qa_live_pages serve --directory /tmp/kg-original-pages-qa --proxy-backend > /tmp/kg-original-pages-api.log 2>&1) &
          (cd /tmp/kg-original-pages-qa && PYTHONPATH="$GITHUB_WORKSPACE" python -m streamlit run "$GITHUB_WORKSPACE/app.py" --server.headless true --server.address 127.0.0.1 --server.port 8521 --server.baseUrlPath management --browser.gatherUsageStats false > /tmp/kg-original-pages-management.log 2>&1) &
          nginx -e /tmp/kg-original-pages-qa/nginx-error.log -p /tmp/kg-original-pages-qa/ -c /tmp/kg-original-pages-qa/nginx.conf
          ready=0
          for n in $(seq 1 60); do
            if curl -fsS --cacert /tmp/kg-original-pages-qa/tls.crt https://127.0.0.1:8520/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then python -c "from pathlib import Path; print(Path('/tmp/kg-original-pages-api.log').read_text())"; exit 1; fi
      - name: Original Pages real login, persisted CRUD, cash, PDF and mobile
        env:
          KG_LIVE_MANAGEMENT: "1"
          KG_LIVE_QA_DIR: /tmp/kg-original-pages-qa
          KG_LIVE_QA_OUT: visual-evidence/original-pages-live
        run: |
          python -m tests.browser_live_pages
          KG_LIVE_QA_OUT="$KG_LIVE_QA_OUT/family" python -m tests.browser_live_family
          KG_LIVE_QA_OUT="$KG_LIVE_QA_OUT/edge-cases" python -m tests.browser_live_edge_cases
          KG_LIVE_QA_OUT="$KG_LIVE_QA_OUT/unified-workspace" python -m tests.browser_unified_workspace
          python -m tests.browser_people_live
          python -m tests.browser_french_live
          python -m tests.browser_reports_live
          python -m tests.browser_security_live
      - name: Start isolated QA previews
        shell: bash
        run: |
          mkdir -p .streamlit
          printf '[postgres]\nurl = "%s"\n' "$TEST_POSTGRES_DSN" > .streamlit/secrets.toml
          git worktree add --detach /tmp/pr1-baseline 6fb700c279b5a0b077f50bfdc7000d7f2907f3e6
          mkdir -p /tmp/pr1-baseline/tests /tmp/pr1-baseline/.streamlit
          cp tests/qa_browser_app.py /tmp/pr1-baseline/tests/qa_browser_app.py
          cp .streamlit/secrets.toml /tmp/pr1-baseline/.streamlit/secrets.toml
          (PYTHONPATH="$GITHUB_WORKSPACE" python -m streamlit run tests/qa_browser_app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 --browser.gatherUsageStats false > /tmp/qa-after.log 2>&1) &
          (PYTHONPATH="$GITHUB_WORKSPACE" python -m streamlit run app.py --server.headless true --server.port 8503 --server.address 127.0.0.1 --browser.gatherUsageStats false > /tmp/qa-access.log 2>&1) &
          (cd /tmp/pr1-baseline && PYTHONPATH=/tmp/pr1-baseline python -m streamlit run tests/qa_browser_app.py --server.headless true --server.port 8502 --server.address 127.0.0.1 --browser.gatherUsageStats false > /tmp/qa-before.log 2>&1) &
          for port in 8501 8502 8503; do
            ready=0
            for n in $(seq 1 80); do
              if curl -fsS "http://127.0.0.1:$port/_stcore/health" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" != 1 ]; then cat /tmp/qa-after.log /tmp/qa-before.log; exit 1; fi
          done
      - name: Current dashboard and department reports on mobile and desktop
        run: PYTHONPATH=. python tests/browser_main_cleanup.py
      - name: Real login, manager accounts, scoped worker activity and revocation
        run: PYTHONPATH=. python tests/browser_admin_access.py
      - name: Real student portraits, file organization and scoped viewer
        run: PYTHONPATH=. python tests/browser_student_profile.py
      # Historical receipt code/audit is retained and tested by pytest, but the
      # old annual-payment operator tab is intentionally no longer reachable.
      - name: Three real sessions, actual ZIP download and dark calendar contrast
        run: PYTHONPATH=. python tests/browser_runtime_readiness.py
      - name: Live salary preview, literal search and recoverable expense correction
        run: PYTHONPATH=. python tests/browser_operator_inputs.py
      - name: Chromium stale payment window after archive
        run: PYTHONPATH=. python tests/browser_archive_receipt.py
      - name: Chromium salary and advance double-submission
        run: PYTHONPATH=. python tests/browser_payroll_review.py
      - name: Chromium student debt refusal and waiver on mobile
        run: PYTHONPATH=. python tests/browser_student_debt.py
      - name: Chromium single-currency operator and scrolled finance acceptance
        run: PYTHONPATH=. python tests/browser_single_currency.py
      - name: Chromium regression and same-data screenshots
        run: python -m tests.browser_pr1
      - name: Actual Chromium monthly/exempt receipt PostgreSQL readback
        run: PYTHONPATH=. python tests/browser_monthly_finance.py
      - name: Chromium child receipts, PDF and history acceptance
        run: PYTHONPATH=. python tests/browser_child_receipts.py
      - name: Render synthetic Arabic PDF evidence
        run: python tests/render_receipt_evidence.py
      - name: Upload actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: child-receipt-audit-finance-chromium-and-pdf
          path: visual-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: QA app log tail on failure
        if: failure()
        run: |
          tail -100 /tmp/qa-after.log || true
          tail -100 /tmp/qa-before.log || true
          tail -100 /tmp/qa-access.log || true
