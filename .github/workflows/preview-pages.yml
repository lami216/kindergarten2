name: Build and publish interface preview

on:
  push:
    branches: [design/simpler-owner-workflow]
    paths:
      - 'docs/**'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interface-preview-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/design/simpler-owner-workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4af321875ef3830c5fd5c8f94f9f2b8abbc3c7aa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check preview and shared interface JavaScript
        run: |
          node --check preview/workspace-runtime.js
          node --check preview/workspace-entry.js
          node --check live/bridge.js
          node --check live/workspace.js
      - name: Test standalone Pages build under its project prefix
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python -m tests.browser_unified_pages_preview
      - name: Build selected interface with disposable synthetic data
        run: python scripts/build_pages_preview.py --output dist
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-pages-preview-checks
          path: visual-evidence/unified-pages-preview
          retention-days: 14
      - name: Prepare Pages build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish selected interface preview
        id: deployment
        uses: actions/deploy-pages@v4
